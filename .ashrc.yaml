# Automated Security Helper (ASH) settings for this sample: https://github.com/awslabs/automated-security-helper
# Run: uvx --from git+https://github.com/awslabs/automated-security-helper.git@v3.8.0 ash --mode local
# Each suppression is a reviewed false positive. Everything else is reported.
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: cdk.out/**
      reason: Synthesized CloudFormation output; the CDK source is scanned and cdk-nag runs with `npm run nag`.
  suppressions:
    - rule_id: SECRET-SECRET-KEYWORD
      path: amplify/backend.ts
      reason: The Secrets Manager secret name (santa-call-center/elevenlabs-api-key), not a secret value.
    - rule_id: SECRET-SECRET-KEYWORD
      path: connect/README.md
      reason: Documentation text about putting the key in the secret; no value.
    - rule_id: SECRET-SECRET-KEYWORD
      path: package.json
      reason: The npm script name "elevenlabs:secret"; no value.
    - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
      path: amplify/shared/email-logo.ts
      reason: Base64 PNG of the email logo, generated by scripts/email-logo.sh.
